name: Publish to npm

on:
  push:
    tags:
      - "dsh-plugin-manager@*"
      - "dsh-plugin-marketplace@*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install --global npm@latest

      - name: Resolve package release
        id: package
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            dsh-plugin-manager@*) directory="packages/manager" ;;
            dsh-plugin-marketplace@*) directory="packages/marketplace" ;;
            *) echo "Unsupported release tag $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          tag_version="${GITHUB_REF_NAME#*@}"
          package_version="$(node --print "require('./$directory/package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package version $package_version." >&2
            exit 1
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Verify generated specifications and catalog
        run: pnpm run generated:check

      - name: Publish
        working-directory: ${{ steps.package.outputs.directory }}
        run: npm publish --access public
