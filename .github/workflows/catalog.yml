name: Update plugin catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      full_reconcile:
        description: "Recheck every discovered repository instead of only repositories updated since the last catalog"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-plugin-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect and validate catalog
        run: pnpm run catalog:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_FULL_RECONCILE: ${{ inputs.full_reconcile || 'false' }}
      - name: Commit catalog changes
        run: |
          git add catalog/v2/catalog.json catalog/v2/scan-state.json
          if git diff --cached --quiet; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update plugin catalog"
          git pull --rebase origin main
          git push origin HEAD:main
